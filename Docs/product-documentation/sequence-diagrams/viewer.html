<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagram Viewer - Ask-SLM Docs</title>
  <style>
    :root {
      --bg: #f7f5ef;
      --paper: #fffdf6;
      --ink: #1f2a20;
      --muted: #55615b;
      --line: #d8d2c2;
      --accent: #2d6d54;
      --accent2: #1f537f;
      --shadow: 0 12px 30px rgba(39, 46, 42, 0.12);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(920px 520px at 96% -8%, #d2e3d4 0%, transparent 70%),
        radial-gradient(850px 520px at -8% 24%, #d5e5ef 0%, transparent 65%),
        var(--bg);
    }

    .shell {
      max-width: 1220px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .left, .right {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.88rem;
      line-height: 1;
      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.primary {
      border-color: var(--accent);
      background: #edf6f0;
      color: #1d513c;
    }

    .btn.secondary {
      border-color: var(--accent2);
      background: #edf4fb;
      color: #1b4a6f;
    }

    .btn.disabled {
      opacity: 0.45;
      pointer-events: none;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.2rem, 2.8vw, 1.75rem);
    }

    .meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }

    .diagram-wrap {
      border: 1px dashed #b8c4b8;
      border-radius: 12px;
      padding: 14px;
      background: #fff;
      overflow: auto;
      min-height: 280px;
    }

    .source {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fdfcf7;
    }

    summary {
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 600;
      color: #2a4d3e;
    }

    pre {
      margin: 0;
      padding: 12px;
      border-top: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "SF Mono", Menlo, monospace;
      font-size: 0.85rem;
      color: #223128;
      background: #fff;
      max-height: 320px;
      overflow: auto;
    }

    .pager {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .caption {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 5px;
      max-width: 420px;
    }

    .empty {
      border: 1px dashed #c1c9be;
      border-radius: 12px;
      background: #fff;
      color: var(--muted);
      padding: 20px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="topbar">
      <div class="left">
        <a class="btn" href="index.html">Main Menu</a>
        <a class="btn" href="README.md" target="_blank" rel="noopener">Diagram README</a>
      </div>
      <div class="right">
        <a id="openEditorTop" class="btn secondary" href="https://www.websequencediagrams.com/app" target="_blank" rel="noopener">Open WSD Editor</a>
      </div>
    </nav>

    <section class="panel" id="content"></section>
  </main>

  <script>
    const diagrams = [
      {
        id: "01-runner-orchestration-and-cache",
        file: "01-runner-orchestration-and-cache.wsd",
        title: "Runner Orchestration and Stage Cache Decisions",
        source: `title Runner Orchestration and Stage Cache Decisions

participant Notebook as runner.ipynb
participant Pipeline as runner_pipeline_manager
participant Workspace as Workspaces/<view>
participant Cache as results/_cache
participant Mapping as MappingEngine
participant Ontology as EnvoResolutionEngine

Notebook->Pipeline: initialize_runner_context(workspace)
Pipeline->Workspace: ensure inputs, mapping_configs, results, Logs

Notebook->Pipeline: prepare_workspace_inputs(context)
Pipeline->Workspace: canonicalize metadata.csv + taxonomy.csv as needed

Notebook->Pipeline: refresh_mapping_templates(metadata_df)
Pipeline->Mapping: refresh_template per bioproject
Pipeline->Workspace: write <project>.json.template files

Notebook->Pipeline: run_enrichment_stage(...)
Pipeline->Cache: compare enrichment_stage_stamp.json
Cache->Pipeline: hit or miss
Pipeline->Mapping: apply configs on miss
Pipeline->Workspace: write enriched_metadata.csv + mapped columns

Notebook->Pipeline: enrich_envo_columns(...)
Pipeline->Ontology: resolve ENVO terms when present
Pipeline->Workspace: write ENVO_Term_Dictionary.csv when terms found

Notebook->Pipeline: run_taxonomy_stage(...)
Pipeline->Cache: compare taxonomy_stage_stamp.json
Cache->Pipeline: hit or miss
Pipeline->Workspace: write abundance matrix + taxon lookup on miss

Notebook->Pipeline: run_merge_stage(...)
Pipeline->Cache: compare merge_stage_stamp.json
Cache->Pipeline: hit or miss
Pipeline->Workspace: write analysis-wide dataset + metadata columns + compatibility stamp`
      },
      {
        id: "02-mapping-config-decision-flow",
        file: "02-mapping-config-decision-flow.wsd",
        title: "Mapping Configuration Decision Flow",
        source: `title Mapping Configuration Decision Flow

participant Notebook
participant Pipeline as run_enrichment_stage
participant ConfigDir as Workspaces/<view>/mapping_configs
participant Mapping as MappingEngine
participant Output as enriched metadata

Notebook->Pipeline: run_enrichment_stage(metadata_df, project_ids, strict_missing_configs)

loop for each bioproject
  Pipeline->ConfigDir: check <project>.json

  alt config exists
    Pipeline->Mapping: map(project_metadata, project_id)
    Mapping->Output: mapped project dataframe
  else config missing
    Pipeline->Mapping: refresh_template(project_metadata, project_id)
    Pipeline->ConfigDir: write <project>.json.template
    Pipeline->Output: append raw project metadata
  end
end

alt strict_missing_configs=True and any missing
  Pipeline->Notebook: raise FileNotFoundError
else continue
  Pipeline->Output: concatenate project outputs
  Pipeline->Output: return enriched_df, mapped_cols, missing_projects
end`
      },
      {
        id: "03-cli-runtime-and-lineage-guardrails",
        file: "03-cli-runtime-and-lineage-guardrails.wsd",
        title: "CLI Runtime Paths and Lineage Guardrails",
        source: `title CLI Runtime Paths and Lineage Guardrails

participant Engineer
participant Entry as askslm.py
participant Runtime as cli._resolve_runtime_paths
participant Command as cmd_*
participant Loader as _load_and_enrich
participant Cache as results/_cache
participant Taxonomy as taxonomy.csv

Engineer->Entry: python askslm.py <command> --view <view> [optional paths]
Entry->Runtime: resolve inputs/config/output directories
Runtime->Command: use Workspaces/<view>/inputs,mapping_configs,results (or explicit overrides)

alt command == build-taxonomy-lineage
  Command->Taxonomy: load taxonomy.csv
  Command->Cache: compare taxonomy_lineage_db_stamp.json (sha256-based)
  Cache->Command: hit or miss
  Command->Cache: write taxonomy_lineage_db.json + stamp on miss
end

alt command == alpha-diversity
  Command->Cache: validate taxonomy_lineage_db.json exists
  alt lineage DB missing
    Command->Engineer: exit with remediation message to run build-taxonomy-lineage
  else lineage DB present
    Command->Loader: load/enrich metadata + taxonomy
    Command->Engineer: produce alpha CSV + HTML outputs
  end
end`
      },
      {
        id: "04-taxonomy-to-analysis-artifact-chain",
        file: "04-taxonomy-to-analysis-artifact-chain.wsd",
        title: "Taxonomy to Analysis Artifact Chain",
        source: `title Taxonomy to Analysis Artifact Chain

participant Notebook
participant Pipeline
participant TaxStage as run_taxonomy_stage
participant MergeStage as run_merge_stage
participant Lineage as build_or_load_tax_accessor
participant Alpha as AlphaDiversityEngine
participant Abundance as TaxonomicAbundanceEngine
participant Results as Workspaces/<view>/results
participant Cache as results/_cache

Notebook->TaxStage: run_taxonomy_stage(taxonomy_df, taxon_key_sep)
TaxStage->Results: Ask_SLM_Taxon_Abundance_Matrix.csv
TaxStage->Results: Ask_SLM_Taxon_Lookup.csv
TaxStage->Cache: taxonomy_stage_stamp.json

Notebook->MergeStage: run_merge_stage(enriched_metadata_df, abundance_matrix, stamps)
MergeStage->Results: Ask_SLM_Analysis_Wide_Dataset.csv
MergeStage->Results: Ask_SLM_Metadata_Columns.json
MergeStage->Cache: merge_stage_stamp.json + Ask_SLM_Cache_Stamp.json

Notebook->Lineage: build_or_load_tax_accessor(taxon_lookup_df, taxonomy_stamp)
Lineage->Cache: compare taxonomy_lineage_db_stamp.json
Lineage->Cache: reuse or rebuild taxonomy_lineage_db.json

Notebook->Alpha: run(..., tax_accessor)
Alpha->Results: interactive analysis + optional exports

Notebook->Abundance: run(...)
Abundance->Results: interactive analysis + optional exports`
      }
    ];

    function esc(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function qp(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    const content = document.getElementById("content");
    const requested = qp("diagram");
    const currentIndex = Math.max(0, diagrams.findIndex(d => d.id === requested));
    const current = diagrams[currentIndex];

    if (!current) {
      content.innerHTML = `<div class="empty">Diagram was not found. <a href="index.html">Go back to main menu</a>.</div>`;
    } else {
      const prev = currentIndex > 0 ? diagrams[currentIndex - 1] : null;
      const next = currentIndex < diagrams.length - 1 ? diagrams[currentIndex + 1] : null;

      document.title = current.title + " - Ask-SLM Docs";

      const cdrawUrl = "https://www.websequencediagrams.com/cgi-bin/cdraw?s=modern-blue&m=" + encodeURIComponent(current.source);

      content.innerHTML = `
        <h1>${current.title}</h1>
        <div class="meta">Source file: ${current.file}</div>

        <div class="diagram-wrap">
          <div class="wsd" wsd-style="modern-blue" wsd-width="1120"><pre>${esc(current.source)}</pre></div>
        </div>

        <details class="source">
          <summary>View Raw Diagram Source</summary>
          <pre>${esc(current.source)}</pre>
        </details>

        <div class="pager">
          <div>
            <a class="btn primary ${prev ? "" : "disabled"}" href="${prev ? "viewer.html?diagram=" + prev.id : "#"}">Previous Diagram</a>
            <div class="caption">${prev ? prev.title : "This is the first diagram."}</div>
          </div>
          <div style="text-align: right;">
            <a class="btn primary ${next ? "" : "disabled"}" href="${next ? "viewer.html?diagram=" + next.id : "#"}">Next Diagram</a>
            <div class="caption">${next ? next.title : "This is the last diagram."}</div>
          </div>
        </div>
      `;

      const editorTop = document.getElementById("openEditorTop");
      editorTop.href = "https://www.websequencediagrams.com/?m=" + encodeURIComponent(current.source);

      // Fallback: if embed script is blocked, show direct rendered image from cdraw endpoint.
      setTimeout(() => {
        const rendered = content.querySelector(".diagram-wrap img");
        if (!rendered) {
          const wrap = content.querySelector(".diagram-wrap");
          wrap.innerHTML = `<img src="${cdrawUrl}" alt="${current.title}" style="max-width:100%;height:auto;display:block;">`;
        }
      }, 900);
    }
  </script>
  <script src="https://www.websequencediagrams.com/service.js"></script>
</body>
</html>
