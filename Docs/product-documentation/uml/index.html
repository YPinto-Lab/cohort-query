<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask-SLM UML Navigator</title>
  <style>
    :root {
      --bg: #f6f6f2;
      --bg2: #e9ece1;
      --card: #fffef8;
      --ink: #1f2a20;
      --muted: #56605b;
      --line: #d4d8cc;
      --accent: #2e6a53;
      --accent2: #1f527f;
      --shadow: 0 12px 28px rgba(33, 41, 35, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1100px 680px at 93% -10%, #cfe0d2 0%, transparent 72%),
        radial-gradient(850px 530px at -10% 22%, #d5e4ef 0%, transparent 67%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
      min-height: 100vh;
    }
    .shell { max-width: 1160px; margin: 0 auto; padding: 24px 20px 48px; }
    .hero {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(130deg, #fefef9 0%, #f5f8ef 100%);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 10px; font-size: clamp(1.35rem, 3vw, 1.95rem); }
    .hero p { margin: 0; color: var(--muted); line-height: 1.5; max-width: 900px; }
    .toolbar {
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr auto auto;
      margin-bottom: 16px;
    }
    .toolbar input, .toolbar a {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      font-size: 0.94rem;
    }
    .toolbar input { justify-content: flex-start; }
    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(12, 1fr);
    }
    .card {
      grid-column: span 6;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
      box-shadow: 0 6px 16px rgba(33, 41, 35, 0.08);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card h2 { margin: 0; font-size: 1.03rem; }
    .meta { color: var(--muted); font-size: 0.86rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 3px; }
    .tag {
      border-radius: 999px;
      border: 1px solid #c9cfc3;
      background: #f6f8f2;
      color: #415047;
      font-size: 0.78rem;
      padding: 3px 9px;
    }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
    .btn {
      border: 1px solid #b5c3b8;
      border-radius: 9px;
      text-decoration: none;
      background: #fff;
      color: #264236;
      padding: 8px 10px;
      font-size: 0.86rem;
      line-height: 1;
    }
    .btn.primary { border-color: var(--accent); background: #edf6f0; color: #1f513c; }
    .btn.secondary { border-color: var(--accent2); background: #edf4fb; color: #1a486b; }
    .empty {
      grid-column: span 12;
      border: 1px dashed #bec7bb;
      background: #fbfcf8;
      border-radius: 12px;
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 900px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
      .card { grid-column: span 12; }
    }
    @media (max-width: 560px) {
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>Ask-SLM UML Navigator</h1>
      <p>
        UML diagrams are rendered directly in the docs website as SVG from PlantUML code.
        Use this gallery to open component/class views without leaving the documentation flow.
      </p>
    </section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Search UML diagrams">
      <a href="README.md" target="_blank" rel="noopener">Open UML README</a>
      <a href="../sequence-diagrams/index.html">Open Sequence Diagrams</a>
    </section>

    <section id="grid" class="grid"></section>
  </main>

  <script>
    const diagrams = [
      {
        id: "component",
        file: "ask-slm-component-diagram.puml",
        title: "Architecture Component Diagram",
        summary: "System boundaries and major modules across notebook, CLI, workflow, accessors, managers, and analysis layers.",
        tags: ["architecture", "component", "boundaries"]
      },
      {
        id: "core-class",
        file: "ask-slm-core-class-diagram.puml",
        title: "Core Runtime Class Diagram",
        summary: "Class-level runtime relationships around runner pipeline, context/logger, processor, taxonomy accessor, and managers.",
        tags: ["class", "runtime", "dependencies"]
      }
    ];

    const grid = document.getElementById("grid");
    const search = document.getElementById("search");

    function render() {
      const q = search.value.trim().toLowerCase();
      const filtered = diagrams.filter(d => [d.title, d.summary, d.file, ...d.tags].join(" ").toLowerCase().includes(q));

      grid.innerHTML = "";
      if (!filtered.length) {
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "No UML diagrams match your search.";
        grid.appendChild(e);
        return;
      }

      for (const d of filtered) {
        const tags = d.tags.map(t => `<span class=\"tag\">${t}</span>`).join("");
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          <h2>${d.title}</h2>
          <div class="meta">File: ${d.file}</div>
          <div class="meta">${d.summary}</div>
          <div class="tags">${tags}</div>
          <div class="actions">
            <a class="btn primary" href="viewer.html?diagram=${d.id}">View UML</a>
            <a class="btn" href="${d.file}" target="_blank" rel="noopener">Open Source</a>
            <a class="btn secondary" href="https://www.plantuml.com/plantuml" target="_blank" rel="noopener">Open PlantUML Online</a>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    search.addEventListener("input", render);
    render();
  </script>
</body>
</html>
