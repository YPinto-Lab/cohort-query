[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-slm"
version = "0.1.0"
description = "Ask-SLM: build a cross-study metagenomic feature table from a research question."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "lancedb>=0.15",
    "pyarrow>=14.0",
    "pandas>=3.0",
    "biom-format>=2.1",
    "ete3>=3.1",
    "google-genai>=2.6",
    "questionary>=2.0",
    "rich>=13.0",
]

[project.scripts]
askslm = "askslm.cli.session:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["askslm*"]
namespaces = true
