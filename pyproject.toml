[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort-query"
version = "0.1.0"
description = "CohortQuery: build a cross-study metagenomic feature table from a research question."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5",
    "lancedb>=0.15",
    "pyarrow>=14.0",
    "pandas>=3.0",
    "biom-format>=2.1",
    "ete3>=3.1",
    "google-genai>=2.6",
    "questionary>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Scripts/eval/audit/render_report.py renders notes.md as real HTML -- mistune was
# already present transitively (via nbconvert) but isn't guaranteed to stay that way.
eval = ["mistune>=3.0"]

[project.scripts]
cohortquery = "cohortquery.cli.session:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cohortquery*"]
namespaces = true
