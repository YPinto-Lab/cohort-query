[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-slm"
version = "0.1.0"
description = "Ask-SLM: a metagenomic analysis toolkit for querying and analyzing SRA datasets."
requires-python = ">=3.12"

[project.scripts]
askslm = "askslm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["askslm*", "agent*", "web*"]
namespaces = true
