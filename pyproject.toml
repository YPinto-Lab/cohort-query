[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-slm"
version = "0.1.0"
description = "Ask-SLM: build a cross-study metagenomic feature table from a research question."
requires-python = ">=3.12"

# No [project.scripts] yet — the `askslm` entry point comes back with the terminal app
# (askslm.cli.session:main). Pointing it at a deleted module would break `pip install -e .`.

[tool.setuptools.packages.find]
where = ["src"]
include = ["askslm*"]
namespaces = true
